name: Build

# Every push builds both apps and runs the tests. Pushing a version tag (git tag v0.8.2 && git push origin v0.8.2) also makes a
# draft release with the macOS DMG attached. Pulsar.exe comes from your PC, so update.json is signed for the exact file people
# download, and the signing key never leaves it. Copy your Release build to release/Pulsar.exe, then:
#   sign_release --exe release/Pulsar.exe --notes-file release/notes.txt --out release/update.json
#   gh release upload v0.8.2 release/Pulsar.exe release/update.json
# then publish the draft on GitHub.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS app (universal)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v7
        with:
          name: Pulsar-macOS
          path: build/Pulsar-*.dmg

  windows:
    name: Windows app
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target Pulsar pulsar_tests --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the tag matches the app version
        run: |
          if [ ! -f "artifacts/Pulsar-${GITHUB_REF_NAME#v}.dmg" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the version in src/core/app_identity.h:" artifacts/*.dmg
            exit 1
          fi

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" "artifacts/Pulsar-${GITHUB_REF_NAME#v}.dmg" --clobber
